# Builds the Android app when a version tag (v1.2.3) is pushed and publishes
# the APK/AAB to a GitHub Release for that tag. The rolling `android-latest`
# release is updated too, so the stable download link keeps working:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/DartLead.apk
#
# Pushes to main do NOT build the app (the web app ships via Vercel on every
# push; the phone build is the deliberate release). Release flow:
#   npm version minor          # bumps package.json and creates the v* tag
#   git push && git push --tags
#
# `workflow_dispatch` still builds a test APK from any branch; those runs only
# upload a workflow artifact and never touch a release.
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   Secrets
#     VITE_SUPABASE_ANON_KEY     the project's anon key (required)
#     ANDROID_KEYSTORE_BASE64    keystore file, base64-encoded (recommended)
#     ANDROID_KEYSTORE_PASSWORD  (with the keystore)
#     ANDROID_KEY_ALIAS          (with the keystore)
#     ANDROID_KEY_PASSWORD       (with the keystore)
#   Variables (optional, defaults below)
#     VITE_SUPABASE_URL, VITE_PUBLIC_APP_URL
#
# Without the keystore secrets the APK is signed with a throw-away debug key,
# which means each build must be uninstalled before the next one installs.
# With them, every build is signed identically and installs over the previous
# one — and the same key can later become the Play Store upload key.

name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production environment
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://hdorqfkaiigjlwobupnq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || 'https://dartlead.app' }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secret VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "VITE_PUBLIC_APP_URL=$PUBLIC_APP_URL"
          } > .env.production.local

      - name: Build web bundle and sync into Android
        run: |
          npm run android:assets
          npm run build
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      # The Gradle wrapper jar is not committed (binary), so use a pinned Gradle
      # from the action instead of ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Prepare signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — APK will be debug-signed (uninstall before installing a newer build)."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi

      # Tag build:   versionName = 1.2.3, versionCode = 1*10000 + 2*100 + 3
      #              (tag must match package.json so the web and app agree)
      # Manual build: versionName = <pkg>-dev+<run>.<sha>, versionCode = run
      #              number offset by 900000000 so a dev build never competes
      #              with a store version code
      - name: Compute version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "$REF_TYPE" = "tag" ]; then
            TAG_VERSION="${REF_NAME#v}"
            if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag '$REF_NAME' is not a vMAJOR.MINOR.PATCH release tag."
              exit 1
            fi
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $REF_NAME does not match package.json version $PKG_VERSION. Bump package.json (npm version) before tagging."
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
            if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
              echo "::error::Minor and patch must be <= 99 for the versionCode scheme."
              exit 1
            fi
            echo "name=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${PKG_VERSION}-dev+${{ github.run_number }}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "code=$((900000000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "pkg=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Collect APK and AAB
        run: |
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          cp "$APK" out/DartLead.apk
          cp "$APK" "out/DartLead-${{ steps.version.outputs.name }}.apk"
          # The .aab is what Google Play accepts; same key, same version.
          cp "$AAB" out/DartLead.aab
          cp "$AAB" "out/DartLead-${{ steps.version.outputs.name }}.aab"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartLead-${{ steps.version.outputs.name }}
          path: |
            out/DartLead-*.apk
            out/DartLead-*.aab
          retention-days: 30

      - name: Publish tagged release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DartLead ${{ steps.version.outputs.name }}
          make_latest: true
          generate_release_notes: true
          files: |
            out/DartLead-${{ steps.version.outputs.name }}.apk
            out/DartLead-${{ steps.version.outputs.name }}.aab
          body: |
            - Version: **${{ steps.version.outputs.name }}** (versionCode ${{ steps.version.outputs.code }}), commit ${{ github.sha }}
            - Signing: **${{ steps.keystore.outputs.signing }}**${{ steps.keystore.outputs.signing == 'debug' && ' — uninstall the previous build before installing this one' || '' }}
            - `.aab` is the Play Store upload bundle (same key, same version).

            Install: download the `.apk` on the phone, open it, allow installing from this source when asked.

      # Keeps the stable download link (docs, website) pointing at the newest
      # tagged build.
      - name: Update rolling android-latest release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DartLead Android — latest release
          prerelease: true
          make_latest: false
          files: |
            out/DartLead.apk
            out/DartLead.aab
          body: |
            Mirror of the newest tagged release, **${{ steps.version.outputs.name }}**
            (see the `${{ github.ref_name }}` release for notes).

            - Stable download link: `DartLead.apk` on this release always points at the newest release.
            - Signing: **${{ steps.keystore.outputs.signing }}**
